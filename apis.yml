name: Carrot Labs
description: >-
  Carrot Labs is the company behind SuperPenguin, an AI spend intelligence
  platform that tracks, attributes, and forecasts spending across 14+ LLM,
  speech, and gateway providers including OpenAI, Anthropic, Google Gemini, AWS
  Bedrock, Vercel AI Gateway, Deepgram, ElevenLabs, LiveKit, and LiteLLM.
  SuperPenguin provides per-request cost attribution (by customer, feature,
  team, environment, prompt key, and prompt version), a multi-provider spend
  dashboard, prompt version analytics, engineering ROI via Cursor pull-request
  cost attribution, billing reconciliation against actual provider invoices, and
  spend alerts over Slack, email, or Discord. It ships lightweight first-party
  Python (`pip install superpenguin`) and TypeScript (`npm install
  @superpenguin/js`) SDKs that wrap native provider clients, add sub-10ms
  overhead, and capture cost metadata without storing prompt or response content
  by default. Carrot Labs is a Y Combinator (Winter 2026) company based in San
  Francisco.
